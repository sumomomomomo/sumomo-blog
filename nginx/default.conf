server {
    listen 8080;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/ {
        # Forward to the POS Spring backend on the LAN without stripping the
        # /api/v1/ prefix (no trailing slash on proxy_pass).
        proxy_pass http://192.168.1.35:18080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # Public requests arrive via Cloudflare as HTTPS; always forward the
        # trusted public scheme, not Nginx's internal $scheme value.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # ZIP uploads up to 10 MiB (default 1 MiB body limit is too small).
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_buffering off;

        # Bounded timeouts; no proxy caching.
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
    }

    location /api/voice {
        proxy_pass http://192.168.1.89:5000/voice;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
